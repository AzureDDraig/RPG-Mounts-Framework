plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

def baseBuildNumberFile = file("build_number.txt")
if (!baseBuildNumberFile.exists()) {
    baseBuildNumberFile.text = "001"
}
def baseBuildNumber = baseBuildNumberFile.text.trim().toInteger()
def baseBuildNumberStr = String.format("%03d", baseBuildNumber)

def evolutionBuildNumberFile = file("build_number_evolution.txt")
if (!evolutionBuildNumberFile.exists()) {
    evolutionBuildNumberFile.text = "001"
}
def evolutionBuildNumber = evolutionBuildNumberFile.text.trim().toInteger()
def evolutionBuildNumberStr = String.format("%03d", evolutionBuildNumber)

ext {
    buildNumberVal = baseBuildNumber
    buildNumberStrVal = baseBuildNumberStr
    
    evolutionBuildNumberVal = evolutionBuildNumber
    evolutionBuildNumberStrVal = evolutionBuildNumberStr
}

// Workaround for Loom configuration phase requiring project dependency JARs to exist before compile
["common", "evolution_addon/common"].each { projDirName ->
    def libsDir = file("${projDirName}/build/libs")
    if (libsDir.exists()) {
        def isEvolution = projDirName.contains("evolution_addon")
        def subprojName = isEvolution ? "evolution_addon_common" : "common"
        def subprojVersion = isEvolution ? "${rootProject.mod_version}-b${evolutionBuildNumberStr}${rootProject.mod_tag}" : "${rootProject.mod_version}-b${baseBuildNumberStr}${rootProject.mod_tag}"
        def targetJar = file("${projDirName}/build/libs/${rootProject.archives_name}-${subprojName}-${rootProject.minecraft_version}-${subprojVersion}.jar")
        if (!targetJar.exists()) {
            def lastJar = libsDir.listFiles().findAll { 
                it.name.endsWith(".jar") && 
                !it.name.contains("sources") && 
                !it.name.contains("transform") &&
                it.name != targetJar.name 
            }.sort { it.lastModified() }
            if (!lastJar.isEmpty()) {
                def sourceJar = lastJar.last()
                println "Copying ${sourceJar.name} to ${targetJar.name} for Loom configuration..."
                targetJar.bytes = sourceJar.bytes
            }
        }
    }
}

tasks.register("incrementBaseBuildNumber") {
    doLast {
        boolean anyFailure = false
        gradle.taskGraph.allTasks.each { task ->
            if (task.state.failure != null) {
                anyFailure = true
            }
        }
        if (!anyFailure) {
            def nextBuildNumber = baseBuildNumber + 1
            baseBuildNumberFile.text = String.format("%03d", nextBuildNumber)
            println "Incremented base build number to ${String.format('%03d', nextBuildNumber)}"
        } else {
            println "Build failed or had task failures. Base build number not incremented."
        }
    }
}

tasks.register("incrementEvolutionBuildNumber") {
    doLast {
        boolean anyFailure = false
        gradle.taskGraph.allTasks.each { task ->
            if (task.state.failure != null) {
                anyFailure = true
            }
        }
        if (!anyFailure) {
            def nextBuildNumber = evolutionBuildNumber + 1
            evolutionBuildNumberFile.text = String.format("%03d", nextBuildNumber)
            println "Incremented evolution build number to ${String.format('%03d', nextBuildNumber)}"
        } else {
            println "Build failed or had task failures. Evolution build number not incremented."
        }
    }
}



architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    if (project.name.startsWith("evolution_addon")) {
        version = "${rootProject.mod_version}-b${evolutionBuildNumberStr}${rootProject.mod_tag}"
    } else {
        version = "${rootProject.mod_version}-b${baseBuildNumberStr}${rootProject.mod_tag}"
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "${rootProject.archives_name}-${project.name}-${rootProject.minecraft_version}"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

tasks.register("deployToDev") {
    dependsOn subprojects.collect { it.tasks.matching { t -> t.name == "deployToDev" } }
}

allprojects {
    tasks.configureEach { task ->
        if (task.name == "deployToDev" || task.name == "test") {
            if (project.name.startsWith("evolution_addon")) {
                task.finalizedBy(rootProject.tasks.named("incrementEvolutionBuildNumber"))
            } else {
                task.finalizedBy(rootProject.tasks.named("incrementBaseBuildNumber"))
            }
        }
    }
}
